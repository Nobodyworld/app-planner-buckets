name: PR82 guarded repair materialization

on:
  push:
    branches: [slice/durable-desktop-persistence]
    paths:
      - .github/pr82-materialize.py
      - .github/workflows/pr82-materialize.yml

permissions:
  contents: read

jobs:
  materialize:
    if: github.repository == 'Nobodyworld/app-planner-buckets' && github.ref == 'refs/heads/slice/durable-desktop-persistence'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact staging commit without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Apply only guarded exact-context corrections
        run: python .github/pr82-materialize.py
      - name: Format native corrections and reconcile Cargo root metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup component add rustfmt
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fetch --manifest-path src-tauri/Cargo.toml
          git diff --check
      - name: Publish reviewed blobs only, never a commit or branch update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/pr82-materialize.py --publish
      - name: Retain exact materialized diff and blob mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr82-repair-proof-${{ github.sha }}
          path: ${{ runner.temp }}/pr82-repair-proof
          if-no-files-found: error
          retention-days: 7
