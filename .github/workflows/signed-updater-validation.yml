name: Signed updater validation

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/signed-updater-validation.yml'
      - 'scripts/release/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'src/components/sidepanel/DesktopUpdateCard.tsx'
      - 'src/components/sidepanel/DesktopUpdateCard.test.tsx'
      - 'src/services/desktopUpdater.ts'
      - 'src/services/desktopUpdater.test.ts'
      - 'src/storage/plannerStorageBridge.ts'
      - 'src/storage/plannerStorageRuntime.ts'

permissions:
  contents: read

jobs:
  signed-updater:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PLANNER_BUCKETS_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect signing configuration
        shell: pwsh
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -and -not [string]::IsNullOrWhiteSpace($env:PLANNER_BUCKETS_UPDATER_PUBKEY)
          if (-not $configured) {
            throw 'Signed updater validation is blocked until TAURI_SIGNING_PRIVATE_KEY and TAURI_UPDATER_PUBLIC_KEY are configured.'
          }
          'Signed updater validation is enabled for this exact PR head.' | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustup component add rustfmt clippy

      - name: Install dependencies
        run: npm ci

      - name: Verify source and release contract
        shell: pwsh
        run: |
          node scripts/release/check-release-config.mjs
          npm run verify
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Materialize signed Tauri configuration
        id: signed-config
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content 'src-tauri/tauri.release.conf.json' -Raw | ConvertFrom-Json -AsHashtable
          $config['plugins'] = @{ updater = @{ pubkey = $env:PLANNER_BUCKETS_UPDATER_PUBKEY } }
          $configPath = Join-Path $env:RUNNER_TEMP 'planner-buckets-signed-tauri.json'
          $config | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $configPath -Encoding utf8NoBOM
          "path=$configPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build signed updater candidate without publishing
        shell: pwsh
        env:
          SIGNED_TAURI_CONFIG: ${{ steps.signed-config.outputs.path }}
        run: npm run desktop:build -- --config "$env:SIGNED_TAURI_CONFIG"

      - name: Cryptographically verify signature and tamper rejection
        id: crypto
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis -File -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw "Expected one NSIS installer; found $($installer.Count)." }
          $signature = "$($installer[0].FullName).sig"
          if (-not (Test-Path -LiteralPath $signature)) { throw 'Signed updater signature is missing.' }
          $publicKeyPath = Join-Path $env:RUNNER_TEMP 'planner-buckets-updater.pub'
          try {
            $publicKeyBytes = [Convert]::FromBase64String($env:PLANNER_BUCKETS_UPDATER_PUBKEY)
          } catch {
            throw 'TAURI_UPDATER_PUBLIC_KEY is not valid base64-encoded Minisign public-key content.'
          }
          [IO.File]::WriteAllBytes($publicKeyPath, $publicKeyBytes)
          $rlib = @(Get-ChildItem src-tauri/target/release/deps -File -Filter 'libminisign_verify-*.rlib')
          if ($rlib.Count -ne 1) { throw "Expected one minisign-verify rlib; found $($rlib.Count)." }
          $verifier = Join-Path $env:RUNNER_TEMP 'verify-updater-signature.exe'
          rustc scripts/release/verify-updater-signature.rs --edition 2021 --extern "minisign_verify=$($rlib[0].FullName)" -o $verifier
          if ($LASTEXITCODE -ne 0) { throw 'Failed to compile updater signature verifier.' }
          & $verifier $installer[0].FullName $signature $publicKeyPath
          if ($LASTEXITCODE -ne 0) { throw 'Updater signature verification or tamper-rejection proof failed.' }
          "installer=$($installer[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "signature=$signature" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify signed updater candidate
        id: evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerPath = '${{ steps.crypto.outputs.installer }}'
          $signature = '${{ steps.crypto.outputs.signature }}'
          if (-not (Test-Path -LiteralPath $installerPath)) { throw 'Signed updater installer is missing after cryptographic verification.' }
          if (-not (Test-Path -LiteralPath $signature)) { throw 'Signed updater signature is missing after cryptographic verification.' }
          $installer = Get-Item -LiteralPath $installerPath
          if ((Get-Item -LiteralPath $signature).Length -lt 16) { throw 'Signed updater signature is unexpectedly short.' }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'signed-updater-evidence'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination $evidenceRoot
          Copy-Item -LiteralPath $signature -Destination $evidenceRoot
          $installerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $signatureHash = (Get-FileHash -LiteralPath $signature -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            schemaVersion = 2
            applicationVersion = [string]$package.version
            sourceSha = '${{ github.event.pull_request.head.sha }}'
            workflowMergeSha = $env:GITHUB_SHA
            pullRequestHead = '${{ github.event.pull_request.head.sha }}'
            workflowRunId = $env:GITHUB_RUN_ID
            workflowRunAttempt = $env:GITHUB_RUN_ATTEMPT
            installerFile = $installer.Name
            installerSizeBytes = $installer.Length
            installerSha256 = $installerHash
            signatureFile = (Split-Path $signature -Leaf)
            signatureSha256 = $signatureHash
            cryptographicSignatureVerified = $true
            tamperRejectionVerified = $true
            releaseConfig = 'runner-local merge of src-tauri/tauri.release.conf.json and TAURI_UPDATER_PUBLIC_KEY'
            published = $false
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $evidenceRoot 'signed-updater-validation.json') -Encoding utf8NoBOM
          "evidence-root=$evidenceRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          @"
          ### Signed updater candidate PASS

          | Field | Value |
          | --- | --- |
          | Source | ``${{ github.event.pull_request.head.sha }}`` |
          | Installer | ``$($installer.Name)`` |
          | Installer SHA-256 | ``$installerHash`` |
          | Signature SHA-256 | ``$signatureHash`` |
          | Cryptographic signature verification | **PASS** |
          | Tamper rejection | **PASS** |
          | Published | **No** |
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Confirm tracked source stayed unchanged
        shell: pwsh
        run: |
          $changes = @(git status --short --untracked-files=no)
          if ($changes.Count -ne 0) {
            $changes | ForEach-Object { Write-Host $_ }
            throw 'Signed updater validation changed tracked repository inputs.'
          }

      - name: Upload signed updater validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-updater-${{ github.event.pull_request.head.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.evidence-root }}
          if-no-files-found: error
          retention-days: 30
