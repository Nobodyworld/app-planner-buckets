name: Windows startup diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/windows-startup-diagnostic.yml'
      - 'src-tauri/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  startup-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build exact NSIS candidate
        run: npm run desktop:build

      - name: Diagnose first installed launch
        id: diagnose
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'planner-startup-diagnostic'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          "artifact-path=$evidence" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          $installer = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -File -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw "Expected exactly one installer; found $($installer.Count)." }
          $install = Start-Process -FilePath $installer[0].FullName -ArgumentList @('/S') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)." }

          $entry = Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.PSObject.Properties.Name -contains 'DisplayName' -and [string]$_.DisplayName -eq 'Planner Buckets' } |
            Select-Object -First 1
          if (-not $entry) { throw 'Planner Buckets uninstall registration was not found.' }

          $displayIcon = [string]$entry.DisplayIcon
          $exe = ($displayIcon -replace ',\d+$', '').Trim('"')
          if (-not (Test-Path -LiteralPath $exe)) {
            $uninstaller = ([string]$entry.UninstallString).Trim('"')
            $root = Split-Path -Parent $uninstaller
            $candidates = @(Get-ChildItem -LiteralPath $root -File -Filter '*.exe' | Where-Object { $_.Name -notmatch '(?i)uninstall|setup' })
            if ($candidates.Count -ne 1) { throw "Could not resolve installed executable; found $($candidates.Count) candidates." }
            $exe = $candidates[0].FullName
          }

          $stdout = Join-Path $evidence 'first-launch.stdout.txt'
          $stderr = Join-Path $evidence 'first-launch.stderr.txt'
          $app = Start-Process -FilePath $exe -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $dataRoot = Join-Path $env:LOCALAPPDATA 'com.nobodyworld.plannerbuckets'
          $primary = Join-Path $dataRoot 'data\planner-v2.json'
          $marker = Join-Path $dataRoot 'migration-v1.complete'
          $deadline = [DateTimeOffset]::UtcNow.AddSeconds(60)
          do {
            if (Test-Path -LiteralPath $primary) { break }
            if ($app.HasExited) { break }
            Start-Sleep -Milliseconds 500
          } while ([DateTimeOffset]::UtcNow -lt $deadline)

          $candidateFiles = @(
            Get-ChildItem -LiteralPath $env:LOCALAPPDATA -Filter 'planner-v2.json' -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
          )
          $rootEntries = if (Test-Path -LiteralPath $dataRoot) {
            @(Get-ChildItem -LiteralPath $dataRoot -Force -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          } else { @() }
          $events = @(
            Get-WinEvent -FilterHashtable @{ LogName='Application'; StartTime=(Get-Date).AddMinutes(-10) } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in @('Application Error', '.NET Runtime', 'Windows Error Reporting') } |
              Select-Object -First 20 TimeCreated, ProviderName, Id, LevelDisplayName, Message
          )
          $diagnostic = [ordered]@{
            sourceSha = (& git rev-parse HEAD).Trim()
            executable = $exe
            processHasExited = $app.HasExited
            exitCode = if ($app.HasExited) { $app.ExitCode } else { $null }
            expectedDataRoot = $dataRoot
            dataRootExists = (Test-Path -LiteralPath $dataRoot)
            primaryExists = (Test-Path -LiteralPath $primary)
            migrationMarkerExists = (Test-Path -LiteralPath $marker)
            matchingPlannerFiles = $candidateFiles
            dataRootEntries = $rootEntries
            applicationEvents = $events
          }
          $diagnostic | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence 'startup-diagnostic.json') -Encoding utf8NoBOM

          if (-not $app.HasExited) {
            try { $app.CloseMainWindow() | Out-Null } catch { }
            Start-Sleep -Seconds 2
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
          }

          if (-not (Test-Path -LiteralPath $primary)) {
            throw 'Installed app did not create the expected durable planner file during diagnostic launch.'
          }

      - name: Upload startup diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: planner-startup-diagnostic-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/planner-startup-diagnostic
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Fail on reproduced startup failure
        if: steps.diagnose.outcome != 'success'
        shell: pwsh
        run: throw 'Installed startup diagnostic reproduced a failure; inspect the retained evidence artifact.'
