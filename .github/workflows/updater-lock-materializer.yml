name: Updater lock materializer

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/signed-desktop-updater'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Generate npm lockfile metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Validate bounded lockfile changes
        run: |
          git diff --check -- package-lock.json src-tauri/Cargo.lock
          git diff --stat -- package-lock.json src-tauri/Cargo.lock
          test -z "$(git diff --name-only -- . ':!package-lock.json' ':!src-tauri/Cargo.lock')"

      - name: Commit generated lockfiles when changed
        run: |
          if git diff --quiet -- package-lock.json src-tauri/Cargo.lock; then
            echo 'Generated lockfiles already match the branch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json src-tauri/Cargo.lock
          git commit -m 'chore(updater): materialize generated lockfiles'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
