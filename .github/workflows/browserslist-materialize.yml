name: Materialize reviewed lock blob
on:
  push:
    branches: ['chore/browserslist-security']
    paths: ['.github/workflows/browserslist-materialize.yml']
permissions:
  contents: write
  actions: read
jobs:
  materialize-reviewed-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify fixed artifact hashes and create one blob only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, urllib.request, urllib.error, zipfile
          repo = 'Nobodyworld/app-planner-buckets'
          api = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'reviewed-lock-materializer'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl): return None
          request = urllib.request.Request(api + '/actions/artifacts/10010081970/zip', headers=headers)
          try:
              response = urllib.request.build_opener(NoRedirect).open(request)
              archive = response.read()
          except urllib.error.HTTPError as error:
              if error.code not in (301, 302, 303, 307, 308): raise
              location = error.headers['Location']
              if not location.startswith('https://'): raise RuntimeError('Non-TLS artifact redirect')
              # Do not forward GitHub authorization to the signed artifact host.
              archive = urllib.request.urlopen(location).read()
          assert hashlib.sha256(archive).hexdigest() == 'ec9af3d4081ce1ddaa11cc1f57f4eef121a639d28a85b9f3e516e2bd3c224e83'
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert z.namelist().count('package-lock.json') == 1
              content = z.read('package-lock.json')
          assert hashlib.sha256(content).hexdigest() == '1d9e61f5cdc59726ad42c3b6aed403a710985e827a5a62ffbd03a017d8b8daf7'
          expected = 'b491716a3b02d36c2efd175a95022c0e2b44e408'
          assert hashlib.sha1(('blob ' + str(len(content)) + '\0').encode() + content).hexdigest() == expected
          payload = json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'}).encode()
          request = urllib.request.Request(api + '/git/blobs', headers={**headers, 'Content-Type': 'application/json'}, data=payload, method='POST')
          result = json.load(urllib.request.urlopen(request))
          assert result['sha'] == expected
          print('VERIFIED_BLOB_SHA=' + expected)
          # Never create a commit, move a ref, edit a PR, or execute artifact contents.
          PY
