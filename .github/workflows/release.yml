name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Verify release version identity
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const tag = process.env.GITHUB_REF_NAME;
          const expected = `v${JSON.parse(fs.readFileSync('package.json', 'utf8')).version}`;
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (tag !== expected || tauri !== expected.slice(1) || cargo !== expected.slice(1)) {
            throw new Error(`Release identity mismatch: tag=${tag}, package=${expected}, tauri=${tauri}, cargo=${cargo}`);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Verify release configuration
        run: node scripts/release/check-release-config.mjs

      - name: Verify browser application
        run: npm run verify

  build-draft-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      PLANNER_BUCKETS_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustup component add rustfmt clippy

      - name: Verify signing configuration and release identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is not configured.'
          }
          if ([string]::IsNullOrWhiteSpace($env:PLANNER_BUCKETS_UPDATER_PUBKEY)) {
            throw 'TAURI_UPDATER_PUBLIC_KEY repository variable is not configured.'
          }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargoVersion = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag -or [string]$tauri.version -ne [string]$package.version -or $cargoVersion -ne [string]$package.version) {
            throw "Release identity mismatch: tag=$env:GITHUB_REF_NAME package=$($package.version) tauri=$($tauri.version) cargo=$cargoVersion"
          }

      - name: Install dependencies
        run: npm ci

      - name: Materialize signed Tauri configuration
        id: signed-config
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content 'src-tauri/tauri.release.conf.json' -Raw | ConvertFrom-Json -AsHashtable
          $config['plugins'] = @{ updater = @{ pubkey = $env:PLANNER_BUCKETS_UPDATER_PUBKEY } }
          $configPath = Join-Path $env:RUNNER_TEMP 'planner-buckets-signed-tauri.json'
          $config | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $configPath -Encoding utf8NoBOM
          "path=$configPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build signed Tauri release artifacts
        shell: pwsh
        env:
          SIGNED_TAURI_CONFIG: ${{ steps.signed-config.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          npm run desktop:build -- --config "$env:SIGNED_TAURI_CONFIG"
          if ($LASTEXITCODE -ne 0) { throw 'Signed Tauri release build failed.' }

      - name: Create draft release and upload signed assets
        id: draft-assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis -File -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw "Expected one NSIS installer; found $($installer.Count)." }
          $localInstaller = $installer[0]
          $localSignature = "$($localInstaller.FullName).sig"
          if (-not (Test-Path -LiteralPath $localSignature)) { throw 'Signed updater artifact is missing the NSIS signature.' }
          $signatureText = (Get-Content -LiteralPath $localSignature -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signatureText)) { throw 'Signed updater signature is empty.' }

          $releaseInstallerName = "planner-buckets-$version-x64-setup.exe"
          $releaseSignatureName = "$releaseInstallerName.sig"
          $releaseStage = Join-Path $env:RUNNER_TEMP 'release-stage'
          New-Item -ItemType Directory -Path $releaseStage -Force | Out-Null
          $stagedInstaller = Join-Path $releaseStage $releaseInstallerName
          $stagedSignature = Join-Path $releaseStage $releaseSignatureName
          $latestPath = Join-Path $releaseStage 'latest.json'
          Copy-Item -LiteralPath $localInstaller.FullName -Destination $stagedInstaller -Force
          Copy-Item -LiteralPath $localSignature -Destination $stagedSignature -Force

          $escapedInstaller = [Uri]::EscapeDataString($releaseInstallerName)
          $assetUrl = "https://github.com/$repo/releases/download/$tag/$escapedInstaller"
          [ordered]@{
            version = $version
            notes = "Planner Buckets $tag"
            pub_date = [DateTimeOffset]::UtcNow.ToString('o')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $signatureText
                url = $assetUrl
              }
            }
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $latestPath -Encoding utf8NoBOM

          $oldPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $existingJson = & gh release view $tag --repo $repo --json isDraft,tagName 2>$null
          $viewExit = $LASTEXITCODE
          $ErrorActionPreference = $oldPreference
          if ($viewExit -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (-not $existing.isDraft -or [string]$existing.tagName -ne $tag) {
              throw 'An incompatible non-draft or mismatched release already exists for this tag.'
            }
            & gh release delete $tag --repo $repo --yes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to reset the existing draft release before rebuilding the candidate.' }
          }

          & gh release create $tag --repo $repo --draft --verify-tag --title "Planner Buckets $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create GitHub Release draft.' }

          foreach ($asset in @($stagedInstaller, $stagedSignature, $latestPath)) {
            & gh release upload $tag $asset --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload draft release asset '$asset'." }
          }

          "release-stage-path=$releaseStage" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify signed draft assets and prepare supplemental evidence
        id: release-evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis -File -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw "Expected one NSIS installer; found $($installer.Count)." }
          $localInstaller = $installer[0]
          $localSignature = "$($localInstaller.FullName).sig"
          if (-not (Test-Path -LiteralPath $localSignature)) { throw 'Signed updater artifact is missing the NSIS signature.' }
          $releaseInstallerName = "planner-buckets-$version-x64-setup.exe"
          $releaseSignatureName = "$releaseInstallerName.sig"

          $releaseCheck = Join-Path $env:RUNNER_TEMP 'release-check'
          New-Item -ItemType Directory -Path $releaseCheck -Force | Out-Null
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --pattern $releaseInstallerName --pattern $releaseSignatureName --pattern 'latest.json' --dir $releaseCheck --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download draft release assets for verification.' }

          $downloadedInstaller = Join-Path $releaseCheck $releaseInstallerName
          $downloadedSignature = Join-Path $releaseCheck $releaseSignatureName
          $latestPath = Join-Path $releaseCheck 'latest.json'
          foreach ($required in @($downloadedInstaller, $downloadedSignature, $latestPath)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Draft release asset was not downloaded: $required" }
          }

          $localInstallerHash = (Get-FileHash -LiteralPath $localInstaller.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $downloadedInstallerHash = (Get-FileHash -LiteralPath $downloadedInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($downloadedInstallerHash -ne $localInstallerHash) { throw 'Downloaded draft installer bytes differ from the locally built signed installer.' }

          $localSignatureText = (Get-Content -LiteralPath $localSignature -Raw).Trim()
          $downloadedSignatureText = (Get-Content -LiteralPath $downloadedSignature -Raw).Trim()
          if ($downloadedSignatureText -ne $localSignatureText) { throw 'Downloaded draft signature differs from the locally generated signature.' }

          $stagedLatest = Join-Path '${{ steps.draft-assets.outputs.release-stage-path }}' 'latest.json'
          $stagedLatestHash = (Get-FileHash -LiteralPath $stagedLatest -Algorithm SHA256).Hash.ToLowerInvariant()
          $downloadedLatestHash = (Get-FileHash -LiteralPath $latestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($downloadedLatestHash -ne $stagedLatestHash) { throw 'Downloaded latest.json differs from the generated release metadata.' }

          $publicKeyPath = Join-Path $env:RUNNER_TEMP 'planner-buckets-updater.pub'
          $decodedSignaturePath = Join-Path $env:RUNNER_TEMP 'planner-buckets-updater.minisig'
          try {
            $publicKeyBytes = [Convert]::FromBase64String($env:PLANNER_BUCKETS_UPDATER_PUBKEY)
            $signatureBytes = [Convert]::FromBase64String($downloadedSignatureText)
          } catch {
            throw 'Updater public key or signature is not valid Tauri base64-wrapped Minisign content.'
          }
          [IO.File]::WriteAllBytes($publicKeyPath, $publicKeyBytes)
          [IO.File]::WriteAllBytes($decodedSignaturePath, $signatureBytes)

          $rlib = @(Get-ChildItem src-tauri/target/release/deps -File -Filter 'libminisign_verify-*.rlib')
          if ($rlib.Count -ne 1) { throw "Expected one minisign-verify rlib; found $($rlib.Count)." }
          $verifier = Join-Path $env:RUNNER_TEMP 'verify-updater-signature.exe'
          rustc scripts/release/verify-updater-signature.rs --edition 2021 --extern "minisign_verify=$($rlib[0].FullName)" -o $verifier
          if ($LASTEXITCODE -ne 0) { throw 'Failed to compile updater signature verifier.' }
          & $verifier $downloadedInstaller $decodedSignaturePath $publicKeyPath
          if ($LASTEXITCODE -ne 0) { throw 'Updater signature verification or tamper-rejection proof failed.' }

          $latest = Get-Content $latestPath -Raw | ConvertFrom-Json
          if ([string]$latest.version -ne $version) { throw "latest.json version '$($latest.version)' does not match '$version'." }
          $windows = @($latest.platforms.PSObject.Properties | Where-Object { $_.Name -like 'windows-x86_64*' })
          if ($windows.Count -ne 1) { throw "Expected exactly one Windows x86_64 updater entry; found $($windows.Count)." }
          if ([string]$windows[0].Value.signature -ne $downloadedSignatureText) {
            throw 'latest.json signature does not match the downloaded signed NSIS updater artifact.'
          }
          $assetUri = [Uri][string]$windows[0].Value.url
          if ($assetUri.Scheme -ne 'https' -or $assetUri.Host -ne 'github.com') { throw 'latest.json contains a non-GitHub HTTPS updater URL.' }
          $decodedPath = [Uri]::UnescapeDataString($assetUri.AbsolutePath)
          $expectedPath = "/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$releaseInstallerName"
          if ($decodedPath -ne $expectedPath) {
            throw "latest.json updater URL '$decodedPath' does not match exact tag asset '$expectedPath'."
          }

          $supplement = Join-Path $env:RUNNER_TEMP 'release-supplement'
          New-Item -ItemType Directory -Path $supplement -Force | Out-Null
          $webZip = Join-Path $supplement "planner-buckets-web-$version.zip"
          Compress-Archive -Path 'dist/*' -DestinationPath $webZip -CompressionLevel Optimal

          $signatureHash = (Get-FileHash -LiteralPath $downloadedSignature -Algorithm SHA256).Hash.ToLowerInvariant()
          $latestHash = (Get-FileHash -LiteralPath $latestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $webHash = (Get-FileHash -LiteralPath $webZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $provenancePath = Join-Path $supplement 'release-provenance.json'
          [ordered]@{
            schemaVersion = 2
            application = 'Planner Buckets'
            applicationVersion = $version
            tag = $env:GITHUB_REF_NAME
            sourceSha = $env:GITHUB_SHA
            workflowRunId = $env:GITHUB_RUN_ID
            workflowRunAttempt = $env:GITHUB_RUN_ATTEMPT
            installerFile = $releaseInstallerName
            installerSizeBytes = (Get-Item -LiteralPath $downloadedInstaller).Length
            installerSha256 = $downloadedInstallerHash
            updaterSignatureFile = (Split-Path $downloadedSignature -Leaf)
            updaterSignatureSha256 = $signatureHash
            cryptographicSignatureVerified = $true
            tamperRejectionVerified = $true
            latestJsonSha256 = $latestHash
            exactUpdaterAssetUrl = [string]$windows[0].Value.url
            webArchiveFile = (Split-Path $webZip -Leaf)
            webArchiveSha256 = $webHash
            updaterMetadataEndpoint = 'https://github.com/Nobodyworld/app-planner-buckets/releases/latest/download/latest.json'
            releaseState = 'draft'
            generatedAtUtc = [DateTimeOffset]::UtcNow.ToString('o')
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $provenancePath -Encoding utf8NoBOM

          "supplement-path=$supplement" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release-check-path=$releaseCheck" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          @"
          ### Signed draft release verified

          | Field | Value |
          | --- | --- |
          | Tag | ``$env:GITHUB_REF_NAME`` |
          | Source | ``$env:GITHUB_SHA`` |
          | Installer | ``$releaseInstallerName`` |
          | Installer SHA-256 | ``$downloadedInstallerHash`` |
          | Signature SHA-256 | ``$signatureHash`` |
          | Signature verification | **PASS** |
          | Tamper rejection | **PASS** |
          | latest.json SHA-256 | ``$latestHash`` |
          | Publication state | **Draft only** |
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload supplemental assets to draft
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(Get-ChildItem -LiteralPath '${{ steps.release-evidence.outputs.supplement-path }}' -File)
          if ($assets.Count -lt 2) { throw 'Expected browser archive and release provenance assets.' }
          foreach ($asset in $assets) {
            & gh release upload $env:GITHUB_REF_NAME $asset.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload supplemental release asset '$($asset.Name)'." }
          }

      - name: Verify complete draft release and leave unpublished
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json isDraft,tagName,assets,url | ConvertFrom-Json
          if (-not $release.isDraft) { throw 'Release was published before explicit promotion approval.' }
          if ([string]$release.tagName -ne $env:GITHUB_REF_NAME) { throw 'Draft release tag does not match the triggering tag.' }
          $names = @($release.assets | ForEach-Object { [string]$_.name })
          foreach ($pattern in @('*-setup.exe', '*-setup.exe.sig', 'latest.json', 'planner-buckets-web-*.zip', 'release-provenance.json')) {
            if (-not ($names | Where-Object { $_ -like $pattern })) { throw "Draft release is missing required asset '$pattern'." }
          }
          @"
          ### Promotion boundary

          The release remains **draft** after complete asset verification.
          Publishing requires a separate explicit owner approval after this exact draft and its provenance are reviewed.
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Retain draft-release verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-draft-verification-${{ github.ref_name }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ steps.release-evidence.outputs.release-check-path }}
            ${{ steps.release-evidence.outputs.supplement-path }}
          if-no-files-found: error
          retention-days: 30
