name: Browserslist resolution evidence

on:
  push:
    branches: ['chore/browserslist-security']
    paths: ['.github/workflows/browserslist-resolution.yml']

permissions:
  contents: read

concurrency:
  group: browserslist-resolution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Generate one narrow npm-produced lockfile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browserslist-evidence"
          cp package-lock.json "$RUNNER_TEMP/browserslist-evidence/baseline-lock.json"
          cp package.json "$RUNNER_TEMP/browserslist-evidence/baseline-package.json"
          git rev-parse HEAD > "$RUNNER_TEMP/browserslist-evidence/worker-source.txt"
          npm update browserslist --package-lock-only --ignore-scripts
          cmp package.json "$RUNNER_TEMP/browserslist-evidence/baseline-package.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const before = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/browserslist-evidence/baseline-lock.json'));
          const after = JSON.parse(fs.readFileSync('package-lock.json'));
          assert.deepEqual(after.packages[''], before.packages['']);
          const value = after.packages['node_modules/browserslist'].version;
          const [major, minor, patch] = value.split('.').map(Number);
          assert(major === 4 && (minor > 28 || (minor === 28 && patch >= 7)), 'Need a patched supported 4.x graph.');
          const changes = [...new Set([...Object.keys(before.packages), ...Object.keys(after.packages)])].filter(k => JSON.stringify(before.packages[k]) !== JSON.stringify(after.packages[k])).map(k => ({ path: k, before: before.packages[k]?.version, after: after.packages[k]?.version }));
          fs.writeFileSync(process.env.RUNNER_TEMP + '/browserslist-evidence/graph-diff.json', JSON.stringify(changes, null, 2));
          console.log(value, changes);
          JS
          git diff --check
          git diff -- package-lock.json > "$RUNNER_TEMP/browserslist-evidence/lockfile.diff"
          cp package-lock.json "$RUNNER_TEMP/browserslist-evidence/package-lock.json"
      - name: Clean install and audit the generated graph
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          set +e
          npm audit --json > "$RUNNER_TEMP/browserslist-evidence/npm-audit.json"
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/browserslist-evidence/npm-audit-exit.txt"
          test "$result" -eq 0
          npm ls browserslist --all > "$RUNNER_TEMP/browserslist-evidence/npm-ls.txt"
          node -e 'const a=require(process.env.RUNNER_TEMP+"/browserslist-evidence/npm-audit.json"); if(a.metadata?.vulnerabilities?.total!==0) process.exit(1)'
      - name: Verify unchanged application against generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm run verify 2>&1 | tee "$RUNNER_TEMP/browserslist-evidence/verify.log"
          git diff --check
          test "$(git diff --name-only)" = 'package-lock.json'
          cmp package-lock.json "$RUNNER_TEMP/browserslist-evidence/package-lock.json"
      - name: Retain resolution evidence for connector review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browserslist-resolution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browserslist-evidence
          retention-days: 14
          if-no-files-found: error
