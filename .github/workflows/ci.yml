name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout exact desktop candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
          cache: npm

      - name: Setup Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustup component add rustfmt clippy

      - name: Install dependencies
        run: npm ci

      - name: Build browser application
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust shell
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust shell
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer
        run: npm run desktop:build

      - name: Prepare installer provenance
        id: installer
        shell: pwsh
        env:
          PLANNER_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PLANNER_WORKFLOW_SHA: ${{ github.sha }}
          PLANNER_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLANNER_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PLANNER_SOURCE_REF: ${{ github.ref }}
          PLANNER_REPOSITORY: ${{ github.repository }}
          PLANNER_EVENT_NAME: ${{ github.event_name }}
          PLANNER_WORKFLOW: ${{ github.workflow }}
          PLANNER_WORKFLOW_REF: ${{ github.workflow_ref }}
          PLANNER_RUN_ID: ${{ github.run_id }}
          PLANNER_RUN_NUMBER: ${{ github.run_number }}
          PLANNER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PLANNER_JOB: ${{ github.job }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:PLANNER_EXPECTED_SOURCE_SHA -notmatch "^[0-9a-fA-F]{40}$") {
            throw "Expected a full 40-character source SHA, received '$env:PLANNER_EXPECTED_SOURCE_SHA'."
          }

          $sourceSha = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          $expectedSourceSha = $env:PLANNER_EXPECTED_SOURCE_SHA.ToLowerInvariant()
          if ($sourceSha -ne $expectedSourceSha) {
            throw "Checked out source SHA '$sourceSha' does not match expected candidate SHA '$expectedSourceSha'."
          }

          $package = Get-Content "package.json" -Raw | ConvertFrom-Json
          $version = [string]$package.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "package.json does not define a usable version."
          }

          $installerDirectory = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $installerDirectory -File -Filter "*-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS setup executable in '$installerDirectory'; found $($installers.Count)."
          }

          $installer = $installers[0]
          $artifactName = "planner-buckets-windows-$version-$sourceSha"
          $artifactDirectory = Join-Path $env:RUNNER_TEMP $artifactName

          if (Test-Path -LiteralPath $artifactDirectory) {
            Remove-Item -LiteralPath $artifactDirectory -Recurse -Force
          }
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null

          $stagedInstaller = Join-Path $artifactDirectory $installer.Name
          Copy-Item -LiteralPath $installer.FullName -Destination $stagedInstaller

          $installerHash = (Get-FileHash -LiteralPath $stagedInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumFileName = "$($installer.Name).sha256"
          $checksumPath = Join-Path $artifactDirectory $checksumFileName
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText(
            $checksumPath,
            "$installerHash *$($installer.Name)`n",
            $utf8NoBom
          )

          $provenance = [ordered]@{
            schemaVersion = 1
            application = "Planner Buckets"
            applicationVersion = $version
            sourceSha = $sourceSha
            expectedSourceSha = $expectedSourceSha
            workflowSha = $env:PLANNER_WORKFLOW_SHA
            pullRequestHeadSha = $env:PLANNER_PR_HEAD_SHA
            pullRequestBaseSha = $env:PLANNER_PR_BASE_SHA
            sourceRef = $env:PLANNER_SOURCE_REF
            repository = $env:PLANNER_REPOSITORY
            eventName = $env:PLANNER_EVENT_NAME
            workflow = $env:PLANNER_WORKFLOW
            workflowRef = $env:PLANNER_WORKFLOW_REF
            workflowRunId = $env:PLANNER_RUN_ID
            workflowRunNumber = $env:PLANNER_RUN_NUMBER
            workflowRunAttempt = $env:PLANNER_RUN_ATTEMPT
            workflowJob = $env:PLANNER_JOB
            workflowRunUrl = "https://github.com/$($env:PLANNER_REPOSITORY)/actions/runs/$($env:PLANNER_RUN_ID)"
            runnerOs = $env:RUNNER_OS
            runnerArch = $env:RUNNER_ARCH
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            nodeVersion = (& node --version).Trim()
            rustcVersion = (& rustc --version).Trim()
            cargoVersion = (& cargo --version).Trim()
            packagingCommand = "npm run desktop:build"
            installerFile = $installer.Name
            installerSizeBytes = $installer.Length
            installerSha256 = $installerHash
            installerBuiltAtUtc = $installer.LastWriteTimeUtc.ToString("o")
            manifestGeneratedAtUtc = [DateTimeOffset]::UtcNow.ToString("o")
            policy = "Canonical only for this exact workflow run, source SHA, and installer hash; not evidence of byte-for-byte reproducibility."
          }

          $provenancePath = Join-Path $artifactDirectory "provenance.json"
          $provenance |
            ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath $provenancePath -Encoding utf8NoBOM

          "artifact-name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact-path=$artifactDirectory" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer-file=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer-size=$($installer.Length)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer-sha256=$installerHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          @"
          ### Windows installer candidate

          | Field | Value |
          | --- | --- |
          | Source SHA | ``$sourceSha`` |
          | Application version | ``$version`` |
          | Installer | ``$($installer.Name)`` |
          | Size | ``$($installer.Length) bytes`` |
          | SHA-256 | ``$installerHash`` |
          | Hosted artifact name | ``$artifactName`` |
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows installer artifact
        id: upload-installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.installer.outputs.artifact-name }}
          path: ${{ steps.installer.outputs.artifact-path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record hosted artifact identity
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ steps.upload-installer.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload-installer.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload-installer.outputs.artifact-digest }}
        run: |
          @"
          ### Hosted artifact record

          | Field | Value |
          | --- | --- |
          | Artifact ID | ``$env:ARTIFACT_ID`` |
          | Artifact archive SHA-256 | ``$env:ARTIFACT_DIGEST`` |
          | Artifact URL | $env:ARTIFACT_URL |
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
